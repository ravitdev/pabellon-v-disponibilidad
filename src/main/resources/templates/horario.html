<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Horario semanal · Pabellón V</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/calendario.css}">
    <script defer th:src="@{/js/app.js}"></script>
    <script defer th:src="@{/js/calendario.js}"></script>
</head>
<body>
<header th:replace="~{fragmentos :: cabecera}"></header>
<main>
    <a class="volver" th:href="@{/}">← Volver a ambientes</a>
    <div class="intro">
        <span class="eyebrow" th:text="${ambiente.tipo} + ' · Piso ' + ${ambiente.piso}"></span>
        <h1 th:text="${ambiente.codigo}"></h1>
        <p>Programación semanal recurrente</p>
    </div>
    <div th:replace="~{fragmentos :: aviso}"></div>

    <section class="panel">
        <div class="calendario-barra">
            <div>
                <h2>Actividades registradas</h2>
                <p class="calendario-descripcion">Bloques azules: actividades programadas. Espacios vacíos: sin actividades registradas.</p>
            </div>
            <button id="cambiar-vista" class="boton-alternar" type="button" hidden>Ver tabla</button>
        </div>

        <!-- La vista de calendario se construye a partir de las filas del horario real. -->
        <div id="calendario-semanal" class="calendario-scroll" hidden aria-label="Calendario semanal de actividades"></div>

        <!-- Tabla original conservada como alternativa accesible y respaldo sin JavaScript. -->
        <div id="tabla-horarios" class="tabla">
            <table th:unless="${#lists.isEmpty(horarios)}">
                <thead>
                <tr>
                    <th scope="col">Día</th>
                    <th scope="col">Inicio</th>
                    <th scope="col">Fin</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="h : ${horarios}">
                    <td class="dia" th:text="${h.nombreDia}"></td>
                    <td th:text="${h.inicio}"></td>
                    <td th:text="${h.fin}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <p th:if="${#lists.isEmpty(horarios)}">Este ambiente no tiene actividades programadas en la información registrada.</p>
    </section>
</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
